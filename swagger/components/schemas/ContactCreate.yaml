type: object
properties:
  name:
    type: string
    example: John Doe
  email:
    type: string
    example: johndoe@example.com
  phoneNumber:
    type: string
    example: '+1234567890'
  isFavourite:
    type: boolean
    example: false
  contactType:
    type: string
    example: personal
  photo:
    type: string
    format: binary
required:
  - name
  - email
  - phoneNumber
  - contactType

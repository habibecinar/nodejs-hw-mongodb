tags:
  - Contacts
summary: Get all contacts
operationId: getContacts
security:
  - bearerAuth: []
description: |
  Returns a list of all contacts for the authenticated user. Supports pagination and filtering.
parameters:
  - name: page
    in: query
    required: false
    schema:
      type: integer
      default: 1
    description: Page number
  - name: perPage
    in: query
    required: false
    schema:
      type: integer
      default: 10
    description: Number of items per page
responses:
  '200':
    description: Successful response. Returns a list of contacts.
    content:
      application/json:
        schema:
          type: object
          properties:
            data:
              type: array
              items:
                $ref: '../../components/schemas/Contact.yaml'
            page:
              type: integer
            perPage:
              type: integer
            totalItems:
              type: integer
            totalPages:
              type: integer
            hasPreviousPage:
              type: boolean
            hasNextPage:
              type: boolean
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: '../../components/responses/Unauthorized.yaml'

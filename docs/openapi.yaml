openapi: 3.1.0
info:
  version: 1.0.0
  title: Node.js Contacts API
  description: API documentation for the Contacts application
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: https://nodejs-hw-mongodb-5-gd4g.onrender.com
  - url: http://localhost:3000
tags:
  - name: Contacts
    description: Operations about contacts
  - name: Auth
    description: Authentication endpoints
paths:
  /contacts:
    get:
      $ref: '../swagger/paths/contacts/get.yaml'
    post:
      $ref: '../swagger/paths/contacts/post.yaml'
  /contacts/{contactId}:
    get:
      $ref: '../swagger/paths/contacts/{id}/get.yaml'
    patch:
      $ref: '../swagger/paths/contacts/{id}/patch.yaml'
    delete:
      $ref: '../swagger/paths/contacts/{id}/delete.yaml'
  /auth/register:
    post:
      $ref: '../swagger/paths/auth/register.yaml'
  /auth/login:
    post:
      $ref: '../swagger/paths/auth/login.yaml'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Contact:
      $ref: '../swagger/components/schemas/Contact.yaml'
    ContactCreate:
      $ref: '../swagger/components/schemas/ContactCreate.yaml'
    ContactUpdate:
      $ref: '../swagger/components/schemas/ContactUpdate.yaml'
    User:
      $ref: '../swagger/components/schemas/User.yaml'
    UserRegister:
      $ref: '../swagger/components/schemas/UserRegister.yaml'
    UserLogin:
      $ref: '../swagger/components/schemas/UserLogin.yaml'
  responses:
    NotFound:
      $ref: '../swagger/components/responses/NotFound.yaml'
    BadRequest:
      $ref: '../swagger/components/responses/BadRequest.yaml'
    Unauthorized:
      $ref: '../swagger/components/responses/Unauthorized.yaml'
